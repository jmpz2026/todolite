<main>
  <h1>TodoLite</h1>
  <p>API: {{ apiStatus() }}</p>

  <form (submit)="$event.preventDefault(); add()">
    <input
      type="text"
      placeholder="Nueva tarea"
      [value]="newTitle()"
      (input)="newTitle.set($any($event.target).value)"
    />
    <button type="submit">Agregar</button>
  </form>

  <ul>
    @for (task of tasks(); track task.id) {
      <li>
        <label [class.done]="task.done">
          <input
            type="checkbox"
            [checked]="task.done"
            (change)="toggle(task, $any($event.target).checked)"
          />
          {{ task.title }}
        </label>
        <button type="button" (click)="remove(task)">Borrar</button>
      </li>
    } @empty {
      <li>No hay tareas.</li>
    }
  </ul>
</main>
